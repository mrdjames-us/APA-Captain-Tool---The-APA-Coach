# Cloudflare Pages configuration.
#
# pages_build_output_dir tells Cloudflare which directory holds the built static
# site (Vite outputs to ./dist). The build COMMAND itself ("npm run build")
# must still be set in the Pages project's dashboard build settings.
#
# nodejs_compat is kept for the Pages Functions in ./functions. They now talk to
# poolplayers.com's GraphQL API using only the global fetch (no Node built-ins),
# so it is not strictly required, but harmless to leave enabled.

name = "apa-captain-tool---the-apa-coach"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"
