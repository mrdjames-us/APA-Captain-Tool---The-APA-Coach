<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI for Missouri | APA Captain Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800;900&family=Inter:wght@300;400;500;600;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              orbitron: ['Orbitron', 'sans-serif'],
              mono: ['Space Mono', 'Courier New', 'monospace'],
            },
            colors: {
              aim: {
                teal:  '#00B4D8',
                gold:  '#E8981D',
                blue:  '#38BDF8',
                navy:  '#0B1929',
              }
            }
          }
        }
      }
    </script>
    <style>
      * { box-sizing: border-box; }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #0B1929;
        color: #E8F4F8;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* ── Grid background ─────────────────────────────────────────── */
      .grid-bg {
        background-color: #0B1929;
        background-image:
          linear-gradient(rgba(0,180,216,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,180,216,0.04) 1px, transparent 1px);
        background-size: 36px 36px;
      }

      /* ── Glow helpers ────────────────────────────────────────────── */
      .glow-teal   { box-shadow: 0 0 24px rgba(0,180,216,.25),  0 0 60px rgba(0,180,216,.08); }
      .glow-gold   { box-shadow: 0 0 24px rgba(232,152,29,.25), 0 0 60px rgba(232,152,29,.08); }
      .glow-blue   { box-shadow: 0 0 24px rgba(56,189,248,.25), 0 0 60px rgba(56,189,248,.08); }

      /* Legacy aliases used by components */
      .glow-cyan    { box-shadow: 0 0 24px rgba(0,180,216,.25),  0 0 60px rgba(0,180,216,.08); }
      .glow-magenta { box-shadow: 0 0 24px rgba(232,152,29,.25), 0 0 60px rgba(232,152,29,.08); }

      .text-glow-teal   { text-shadow: 0 0 18px rgba(0,180,216,.9),  0 0 40px rgba(0,180,216,.4); }
      .text-glow-gold   { text-shadow: 0 0 18px rgba(232,152,29,.9), 0 0 40px rgba(232,152,29,.4); }
      .text-glow-blue   { text-shadow: 0 0 18px rgba(56,189,248,.9), 0 0 40px rgba(56,189,248,.4); }

      /* Legacy aliases */
      .text-glow-cyan    { text-shadow: 0 0 18px rgba(0,180,216,.9),  0 0 40px rgba(0,180,216,.4); }
      .text-glow-magenta { text-shadow: 0 0 18px rgba(232,152,29,.9), 0 0 40px rgba(232,152,29,.4); }
      .text-glow-green   { text-shadow: 0 0 18px rgba(56,189,248,.9), 0 0 40px rgba(56,189,248,.4); }

      /* ── Card ────────────────────────────────────────────────────── */
      .card {
        background: rgba(7, 16, 35, 0.85);
        border: 1px solid rgba(0,180,216,0.12);
        backdrop-filter: blur(12px);
        transition: border-color .2s, box-shadow .2s;
      }
      .card:hover {
        border-color: rgba(0,180,216,0.3);
        box-shadow: 0 0 30px rgba(0,180,216,0.06);
      }
      .card-active {
        border-color: rgba(0,180,216,0.45) !important;
        box-shadow: 0 0 40px rgba(0,180,216,0.12) !important;
      }

      /* ── Neon buttons ────────────────────────────────────────────── */
      .btn-neon {
        background: transparent;
        border: 1px solid #00B4D8;
        color: #00B4D8;
        text-shadow: 0 0 10px rgba(0,180,216,0.7);
        box-shadow: 0 0 14px rgba(0,180,216,0.2), inset 0 0 14px rgba(0,180,216,0.04);
        transition: all .2s;
        font-family: 'Orbitron', sans-serif;
        letter-spacing: .08em;
      }
      .btn-neon:hover:not(:disabled) {
        background: rgba(0,180,216,0.12);
        box-shadow: 0 0 28px rgba(0,180,216,0.45), inset 0 0 20px rgba(0,180,216,0.08);
      }
      .btn-neon:disabled { opacity: .4; cursor: not-allowed; }

      .btn-neon-gold {
        border-color: #E8981D; color: #E8981D;
        text-shadow: 0 0 10px rgba(232,152,29,0.7);
        box-shadow: 0 0 14px rgba(232,152,29,0.2);
      }
      .btn-neon-gold:hover:not(:disabled) {
        background: rgba(232,152,29,0.1);
        box-shadow: 0 0 28px rgba(232,152,29,0.45);
      }

      /* Legacy magenta alias → gold */
      .btn-neon-magenta {
        border-color: #E8981D; color: #E8981D;
        text-shadow: 0 0 10px rgba(232,152,29,0.7);
        box-shadow: 0 0 14px rgba(232,152,29,0.2);
      }
      .btn-neon-magenta:hover:not(:disabled) {
        background: rgba(232,152,29,0.1);
        box-shadow: 0 0 28px rgba(232,152,29,0.45);
      }

      /* Filled primary */
      .btn-solid-cyan {
        background: rgba(0,180,216,0.15);
        border: 1px solid rgba(0,180,216,0.6);
        color: #00B4D8;
        text-shadow: 0 0 10px rgba(0,180,216,0.6);
        box-shadow: 0 0 20px rgba(0,180,216,0.2);
        font-family: 'Orbitron', sans-serif;
        letter-spacing: .08em;
        transition: all .2s;
      }
      .btn-solid-cyan:hover:not(:disabled) {
        background: rgba(0,180,216,0.25);
        box-shadow: 0 0 35px rgba(0,180,216,0.4);
      }
      .btn-solid-cyan:disabled { opacity:.4; cursor:not-allowed; }

      /* ── Nav ─────────────────────────────────────────────────────── */
      .nav-item {
        border-left: 2px solid transparent;
        color: rgba(232,244,248,0.72);
        transition: all .18s;
      }
      .nav-item:hover { color: rgba(232,244,248,0.95); border-left-color: rgba(0,180,216,0.5); }
      .nav-item.active {
        border-left-color: #00B4D8;
        color: #00B4D8;
        background: rgba(0,180,216,0.07);
        text-shadow: 0 0 10px rgba(0,180,216,0.5);
      }

      /* ── Skill LEDs ──────────────────────────────────────────────── */
      .led { width: 10px; height: 10px; border-radius: 2px; }
      .led-on-cyan    { background:#00B4D8; box-shadow:0 0 6px #00B4D8, 0 0 12px rgba(0,180,216,.5); }
      .led-on-gold    { background:#E8981D; box-shadow:0 0 6px #E8981D, 0 0 12px rgba(232,152,29,.5); }
      .led-on-magenta { background:#E8981D; box-shadow:0 0 6px #E8981D, 0 0 12px rgba(232,152,29,.5); }
      .led-off        { background:rgba(255,255,255,0.07); }

      /* ── Inputs ──────────────────────────────────────────────────── */
      .input-neon {
        background: rgba(0,10,30,0.8);
        border: 1px solid rgba(0,180,216,0.2);
        color: #E8F4F8;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
        border-radius: 4px;
      }
      .input-neon::placeholder { color: rgba(232,244,248,0.25); }
      .input-neon:focus {
        border-color: rgba(0,180,216,0.6);
        box-shadow: 0 0 16px rgba(0,180,216,0.15);
      }

      select.input-neon option { background: #0B1929; color: #E8F4F8; }

      /* ── Scrollbar ───────────────────────────────────────────────── */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #0B1929; }
      ::-webkit-scrollbar-thumb { background: rgba(0,180,216,0.25); border-radius: 2px; }

      /* ── Misc ────────────────────────────────────────────────────── */
      .section-label {
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        letter-spacing: .15em;
        text-transform: uppercase;
        color: rgba(0,180,216,0.85);
      }
      .stat-num {
        font-family: 'Space Mono', monospace;
        font-size: 2.5rem;
        line-height: 1;
        color: #E8F4F8;
      }

      @keyframes flicker {
        0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:.7} 94%{opacity:1} 96%{opacity:.8} 97%{opacity:1}
      }
      .flicker { animation: flicker 8s infinite; }

      @keyframes pulse-ring {
        0%   { box-shadow: 0 0 0 0 rgba(0,180,216,.5); }
        70%  { box-shadow: 0 0 0 12px rgba(0,180,216,0); }
        100% { box-shadow: 0 0 0 0 rgba(0,180,216,0); }
      }
      .pulse-ring { animation: pulse-ring 2.4s infinite; }
    </style>
</head>
<body class="grid-bg">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
