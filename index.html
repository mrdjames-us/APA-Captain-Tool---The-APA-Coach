<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APA Coach | Captain HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800;900&family=Inter:wght@300;400;500;600;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              orbitron: ['Orbitron', 'sans-serif'],
              mono: ['Space Mono', 'Courier New', 'monospace'],
            },
            colors: {
              neon: {
                cyan:    '#00E5FF',
                magenta: '#FF0066',
                gold:    '#FFB700',
                green:   '#00FF88',
              }
            }
          }
        }
      }
    </script>
    <style>
      * { box-sizing: border-box; }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #000008;
        color: #D0E8FF;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* ── Grid background ─────────────────────────────────────────── */
      .grid-bg {
        background-color: #000008;
        background-image:
          linear-gradient(rgba(0,229,255,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,229,255,0.035) 1px, transparent 1px);
        background-size: 36px 36px;
      }

      /* ── Glow helpers ────────────────────────────────────────────── */
      .glow-cyan    { box-shadow: 0 0 24px rgba(0,229,255,.25), 0 0 60px rgba(0,229,255,.08); }
      .glow-magenta { box-shadow: 0 0 24px rgba(255,0,102,.25), 0 0 60px rgba(255,0,102,.08); }
      .glow-gold    { box-shadow: 0 0 24px rgba(255,183,0,.25),  0 0 60px rgba(255,183,0,.08);  }
      .glow-green   { box-shadow: 0 0 24px rgba(0,255,136,.25), 0 0 60px rgba(0,255,136,.08); }

      .text-glow-cyan    { text-shadow: 0 0 18px rgba(0,229,255,.9),  0 0 40px rgba(0,229,255,.4); }
      .text-glow-gold    { text-shadow: 0 0 18px rgba(255,183,0,.9),  0 0 40px rgba(255,183,0,.4); }
      .text-glow-magenta { text-shadow: 0 0 18px rgba(255,0,102,.9),  0 0 40px rgba(255,0,102,.4); }
      .text-glow-green   { text-shadow: 0 0 18px rgba(0,255,136,.9),  0 0 40px rgba(0,255,136,.4); }

      /* ── Card ────────────────────────────────────────────────────── */
      .card {
        background: rgba(2, 4, 20, 0.85);
        border: 1px solid rgba(0,229,255,0.12);
        backdrop-filter: blur(12px);
        transition: border-color .2s, box-shadow .2s;
      }
      .card:hover {
        border-color: rgba(0,229,255,0.3);
        box-shadow: 0 0 30px rgba(0,229,255,0.06);
      }
      .card-active {
        border-color: rgba(0,229,255,0.45) !important;
        box-shadow: 0 0 40px rgba(0,229,255,0.12) !important;
      }

      /* ── Neon buttons ────────────────────────────────────────────── */
      .btn-neon {
        background: transparent;
        border: 1px solid #00E5FF;
        color: #00E5FF;
        text-shadow: 0 0 10px rgba(0,229,255,0.7);
        box-shadow: 0 0 14px rgba(0,229,255,0.2), inset 0 0 14px rgba(0,229,255,0.04);
        transition: all .2s;
        font-family: 'Orbitron', sans-serif;
        letter-spacing: .08em;
      }
      .btn-neon:hover:not(:disabled) {
        background: rgba(0,229,255,0.12);
        box-shadow: 0 0 28px rgba(0,229,255,0.45), inset 0 0 20px rgba(0,229,255,0.08);
      }
      .btn-neon:disabled { opacity: .4; cursor: not-allowed; }

      .btn-neon-gold {
        border-color: #FFB700; color: #FFB700;
        text-shadow: 0 0 10px rgba(255,183,0,0.7);
        box-shadow: 0 0 14px rgba(255,183,0,0.2);
      }
      .btn-neon-gold:hover:not(:disabled) {
        background: rgba(255,183,0,0.1);
        box-shadow: 0 0 28px rgba(255,183,0,0.45);
      }

      .btn-neon-magenta {
        border-color: #FF0066; color: #FF0066;
        text-shadow: 0 0 10px rgba(255,0,102,0.7);
        box-shadow: 0 0 14px rgba(255,0,102,0.2);
      }
      .btn-neon-magenta:hover:not(:disabled) {
        background: rgba(255,0,102,0.1);
        box-shadow: 0 0 28px rgba(255,0,102,0.45);
      }

      /* Filled primary */
      .btn-solid-cyan {
        background: rgba(0,229,255,0.15);
        border: 1px solid rgba(0,229,255,0.6);
        color: #00E5FF;
        text-shadow: 0 0 10px rgba(0,229,255,0.6);
        box-shadow: 0 0 20px rgba(0,229,255,0.2);
        font-family: 'Orbitron', sans-serif;
        letter-spacing: .08em;
        transition: all .2s;
      }
      .btn-solid-cyan:hover:not(:disabled) {
        background: rgba(0,229,255,0.25);
        box-shadow: 0 0 35px rgba(0,229,255,0.4);
      }
      .btn-solid-cyan:disabled { opacity:.4; cursor:not-allowed; }

      /* ── Nav ─────────────────────────────────────────────────────── */
      .nav-item {
        border-left: 2px solid transparent;
        color: rgba(208,232,255,0.72);
        transition: all .18s;
      }
      .nav-item:hover { color: rgba(208,232,255,0.95); border-left-color: rgba(0,229,255,0.5); }
      .nav-item.active {
        border-left-color: #00E5FF;
        color: #00E5FF;
        background: rgba(0,229,255,0.07);
        text-shadow: 0 0 10px rgba(0,229,255,0.5);
      }

      /* ── Skill LEDs ──────────────────────────────────────────────── */
      .led { width: 10px; height: 10px; border-radius: 2px; }
      .led-on-cyan    { background:#00E5FF; box-shadow:0 0 6px #00E5FF, 0 0 12px rgba(0,229,255,.5); }
      .led-on-gold    { background:#FFB700; box-shadow:0 0 6px #FFB700, 0 0 12px rgba(255,183,0,.5); }
      .led-on-magenta { background:#FF0066; box-shadow:0 0 6px #FF0066, 0 0 12px rgba(255,0,102,.5); }
      .led-off        { background:rgba(255,255,255,0.07); }

      /* ── Inputs ──────────────────────────────────────────────────── */
      .input-neon {
        background: rgba(0,10,30,0.8);
        border: 1px solid rgba(0,229,255,0.2);
        color: #D0E8FF;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
        border-radius: 4px;
      }
      .input-neon::placeholder { color: rgba(208,232,255,0.25); }
      .input-neon:focus {
        border-color: rgba(0,229,255,0.6);
        box-shadow: 0 0 16px rgba(0,229,255,0.15);
      }

      select.input-neon option { background: #050518; color: #D0E8FF; }

      /* ── Scrollbar ───────────────────────────────────────────────── */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #000008; }
      ::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.25); border-radius: 2px; }

      /* ── Misc ────────────────────────────────────────────────────── */
      .section-label {
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        letter-spacing: .15em;
        text-transform: uppercase;
        color: rgba(0,229,255,0.85);
      }
      .stat-num {
        font-family: 'Space Mono', monospace;
        font-size: 2.5rem;
        line-height: 1;
        color: #D0E8FF;
      }

      @keyframes flicker {
        0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:.7} 94%{opacity:1} 96%{opacity:.8} 97%{opacity:1}
      }
      .flicker { animation: flicker 8s infinite; }

      @keyframes pulse-ring {
        0%   { box-shadow: 0 0 0 0 rgba(0,229,255,.5); }
        70%  { box-shadow: 0 0 0 12px rgba(0,229,255,0); }
        100% { box-shadow: 0 0 0 0 rgba(0,229,255,0); }
      }
      .pulse-ring { animation: pulse-ring 2.4s infinite; }
    </style>
</head>
<body class="grid-bg">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
